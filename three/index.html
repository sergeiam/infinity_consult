<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Consult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="tip" aria-hidden="true"></div>
<header class="hdr" data-block="hdr"></header>
<main>
  <div data-page="home">
    <section class="hero"><div class="wrap"><div class="hero-txt">
      <p class="eyebrow" data-i18n="hero.eyebrow"></p>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.sub"></p>
      <div class="actions"><a class="btn" href="#/contact" data-i18n="hero.cta1"></a><a class="btn ghost" href="#/process" data-i18n="hero.cta2"></a></div>
    </div></div><div class="scroll-cue" aria-hidden="true"></div></section>
    <section class="story right" id="st-explode"><div class="wrap"><div class="panel">
      <span class="num">02</span><h2 data-i18n="p2.t"></h2><p data-i18n="p2.d"></p>
    </div></div></section>
    <section class="story left" id="st-sort"><div class="wrap"><div class="panel">
      <h2 data-i18n="demo.title"></h2><div class="demo" data-block="demo"></div>
    </div></div></section>
    <section class="veil"><div class="wrap">
      <div class="stats" data-block="stats"></div>
      <div class="sec-head" data-block="head" data-k="srv"></div>
      <div class="cards" data-block="services"></div>
    </div></section>
    <section class="veil"><div class="wrap">
      <div class="sec-head" data-block="head" data-k="why"></div>
      <div class="why" data-block="why"></div>
    </div></section>
    <section class="cta-band veil" data-block="cta"></section>
  </div>

  <div data-page="services">
    <section class="page-top"><div class="wrap">
      <div class="sec-head" data-block="head" data-k="srv"></div>
      <div class="cards" data-block="services"></div>
    </div></section>
    <section><div class="wrap">
      <div class="sec-head" data-block="head" data-k="cats"></div>
      <ul class="cats" data-block="cats"></ul>
    </div></section>
    <section class="cta-band" data-block="cta"></section>
  </div>

  <div data-page="process">
    <section class="page-top"><div class="wrap">
      <div class="sec-head" data-block="head" data-k="proc"></div>
      <ol class="steps panel" data-block="steps"></ol>
    </div></section>
    <section class="cta-band" data-block="cta"></section>
  </div>

  <div data-page="about">
    <section class="page-top"><div class="wrap">
      <p class="eyebrow" data-i18n="about.title"></p>
      <h1 class="about-lead" data-i18n="about.lead"></h1>
      <div class="prose"><p data-i18n="about.p1"></p><p data-i18n="about.p2"></p></div>
    </div></section>
    <section><div class="wrap"><div class="values" data-block="values"></div></div></section>
    <section><div class="wrap">
      <div class="sec-head" data-block="head" data-k="why"></div>
      <div class="why" data-block="why"></div>
    </div></section>
    <section class="cta-band" data-block="cta"></section>
  </div>

  <div data-page="contact">
    <section class="page-top"><div class="wrap">
      <div class="sec-head" data-block="head" data-k="ct"></div>
      <div class="contact"><div class="panel" data-block="form"></div><div class="info panel" data-block="info"></div></div>
    </div></section>
  </div>
</main>
<footer class="ftr" data-block="footer"></footer>
<script src="../shared/i18n.js"></script>
<script src="../shared/site.js"></script>
<script src="scene.js"></script>
</body>
</html>
